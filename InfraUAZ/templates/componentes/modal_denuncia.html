



<div class="modal fade" id="modalDenuncia" tabindex="-1" aria-labelledby="modalDenunciaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="modalDenunciaLabel">
                    <i class="bi bi-flag-fill text-danger me-2"></i> Reportar Denuncia
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="reporteDenunciaForm" method="post" action="{% url 'reportar_denuncia' %}">
            {% csrf_token %}
            <input type="hidden" name="id_denuncia" value="{{ denuncia.id_denuncia }}">
            <div class="modal-body">
                <div class="alert alert-warning d-flex align-items-center rounded-3 py-2">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>
                        <strong>Advertencia:</strong> Solo reporte esta denuncia si se trata de una denuncia falsa o inapropiada.
                    </div>
                </div>

                <p>
                    Esta acción cancelará la denuncia y puede aplicar una sanción al usuario denunciante.
                    Seleccione el tiempo de suspensión de la cuenta:
                </p>

                <div class="mb-3">
                    <label for="tiempoSancion" class="form-label fw-semibold">Tiempo de Sanción</label>
                    <select class="form-select" id="tiempoSancion" name="tiempoSancion">
                        <option value = "0"selected>Sin sanción (solo cancelar)</option>
                        <option value="1">1 día</option>
                        <option value="3">3 días</option>
                        <option value="7">7 días</option>
                        <option value="00">Suspensión permanente</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-danger">Confirmar Reporte</button>
            </div>
            </form>
        </div>
    </div>
</div>
