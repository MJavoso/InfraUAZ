services:
  web-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: web-app
    ports:
      - "8000"
    depends_on:
      - db
    volumes:
      - ./InfraUAZ:/InfraUAZ
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      
      SECRET: ${SECRET}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEBUG_MODE: ${DEBUG}
      EMAIL_ACTIVATION_DOMAIN: ${EMAIL_ACTIVATION_DOMAIN}
      DISABLE_UAZ_EMAILS: ${DISABLE_UAZ_EMAILS}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      SUB_DIR: ${SUB_DIR}

  
  db:
    image: postgres:16.10-alpine3.22
    container_name: web-app-db
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: web-app-nginx
    ports:
      - "8000:80"
    depends_on:
      - web-app
    volumes:
      - ./InfraUAZ/static:/InfraUAZ/static
      - ./InfraUAZ/media:/InfraUAZ/media

volumes:
  db:    